<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡通訊 App</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QR Code 產生與掃描工具 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js"></script>
  <!-- PeerJS (免費 WebRTC 免伺服器通話工具) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col justify-between overflow-hidden">

  <!-- 註冊 / 登入頁面 -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-900 flex flex-col justify-center items-center p-6">
    <h1 class="text-3xl font-bold mb-6 text-indigo-400">登入 / 註冊</h1>
    <input id="auth-username" type="text" placeholder="帳號" class="w-full max-w-xs p-3 rounded bg-slate-800 border border-slate-700 mb-3 text-white">
    <input id="auth-password" type="password" placeholder="密碼" class="w-full max-w-xs p-3 rounded bg-slate-800 border border-slate-700 mb-4 text-white">
    <div class="flex gap-4">
      <button onclick="handleAuth('login')" class="bg-indigo-600 px-6 py-2 rounded font-bold">登入</button>
      <button onclick="handleAuth('register')" class="bg-emerald-600 px-6 py-2 rounded font-bold">註冊</button>
    </div>
  </div>

  <!-- 主畫面：頂部導覽列 -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img id="my-avatar" class="w-10 h-10 rounded-full border border-indigo-400 cursor-pointer" onclick="openProfileSettings()">
      <span id="my-username" class="font-bold"></span>
    </div>
    <div class="flex gap-2">
      <button onclick="showQRCode()" class="bg-slate-700 p-2 rounded text-xs">我的 QR</button>
      <button onclick="startQRScan()" class="bg-slate-700 p-2 rounded text-xs">掃 QR 加好友</button>
      <button onclick="createGroupPrompt()" class="bg-indigo-600 p-2 rounded text-xs">+ 建群組</button>
    </div>
  </header>

  <!-- 中間內容：聊天清單與對話視窗 -->
  <main class="flex-1 flex overflow-hidden">
    <!-- 側邊欄：好友與群組清單 -->
    <section class="w-1/3 border-r border-slate-800 bg-slate-850 overflow-y-auto" id="chat-list">
      <div class="p-2 text-xs text-slate-400 font-bold">好友與群組</div>
      <div id="friends-container"></div>
      <div id="groups-container"></div>
    </section>

    <!-- 對話視窗區域 -->
    <section class="w-2/3 flex flex-col bg-slate-900" id="chat-window">
      <!-- 聊天室頂部資訊列 -->
      <div id="chat-header" class="p-3 bg-slate-800 flex justify-between items-center border-b border-slate-700 hidden">
        <span id="chat-title" class="font-bold"></span>
        <div class="flex gap-2">
          <button onclick="startCall(false)" class="bg-green-600 px-3 py-1 rounded text-xs">語音通話</button>
          <button onclick="startCall(true)" class="bg-blue-600 px-3 py-1 rounded text-xs">視訊通話</button>
          <button onclick="leaveOrDeleteChat()" class="bg-red-600 px-3 py-1 rounded text-xs">退出/刪除</button>
        </div>
      </div>

      <!-- 訊息列表 -->
      <div id="messages-box" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3"></div>

      <!-- 訊息輸入欄 -->
      <div id="chat-input-area" class="p-3 bg-slate-800 border-t border-slate-700 flex items-center gap-2 hidden">
        <input type="file" id="file-input" class="hidden" onchange="uploadFile(this)">
        <button onclick="document.getElementById('file-input').click()" class="bg-slate-700 p-2 rounded text-xs">📎</button>
        <input id="msg-input" type="text" placeholder="輸入訊息... (@可標記成員)" class="flex-1 p-2 rounded bg-slate-700 text-white border-none focus:outline-none">
        <button onclick="sendMessage()" class="bg-indigo-600 px-4 py-2 rounded text-xs font-bold">發送</button>
      </div>
    </section>
  </main>

  <!-- 彈出模組視窗 (QR code / 掃描器 / 視訊視窗) -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/80 flex justify-center items-center hidden">
    <div class="bg-slate-800 p-6 rounded-lg max-w-sm w-full flex flex-col items-center gap-4 relative">
      <button onclick="closeModal()" class="absolute top-2 right-2 text-slate-400">✕</button>
      <div id="modal-content" class="w-full text-center"></div>
    </div>
  </div>

  <!-- 視訊畫面容器 -->
  <div id="video-container" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center hidden">
    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
    <video id="local-video" autoplay playsinline muted class="w-32 h-48 absolute top-4 right-4 border-2 border-white rounded-lg"></video>
    <button onclick="endCall()" class="absolute bottom-8 bg-red-600 px-6 py-3 rounded-full font-bold">掛斷通話</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
