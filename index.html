<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>極速 LINE / Telegram 通訊 App</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    .chat-slide-open { transform: translateX(0) !important; z-index: 40 !important; }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col justify-between overflow-hidden">

  <!-- 登入 / 註冊視窗 -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-900 flex flex-col justify-center items-center p-6">
    <h1 class="text-3xl font-bold mb-6 text-indigo-400">極速 Chat 登入</h1>
    <input id="auth-username" type="text" placeholder="帳號" class="w-full max-w-xs p-3 rounded bg-slate-800 border border-slate-700 mb-3 text-white">
    <input id="auth-password" type="password" placeholder="密碼" class="w-full max-w-xs p-3 rounded bg-slate-800 border border-slate-700 mb-4 text-white">
    <div class="flex gap-4">
      <button onclick="handleAuth('login')" class="bg-indigo-600 px-6 py-2 rounded font-bold">登入</button>
      <button onclick="handleAuth('register')" class="bg-emerald-600 px-6 py-2 rounded font-bold">註冊</button>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="p-3 bg-slate-800 border-b border-slate-700 flex justify-between items-center z-10">
    <div class="flex items-center gap-2">
      <img id="my-avatar" class="w-9 h-9 rounded-full object-cover border border-indigo-400">
      <span id="my-username" class="font-bold text-sm"></span>
    </div>
    <div class="flex gap-2">
      <button onclick="showQRCode()" class="bg-slate-700 px-2 py-1 rounded text-xs">我的 QR</button>
      <button onclick="startQRScan()" class="bg-slate-700 px-2 py-1 rounded text-xs">掃 QR</button>
      <button onclick="createGroupPrompt()" class="bg-indigo-600 px-2 py-1 rounded text-xs">+ 建群組</button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 flex overflow-hidden relative">
    
    <!-- 左側選單面板 -->
    <section id="sidebar" class="w-full md:w-1/3 border-r border-slate-800 bg-slate-900 flex flex-col h-full z-20">
      <div class="flex border-b border-slate-700 bg-slate-800">
        <button onclick="switchTab('friends')" id="tab-friends" class="flex-1 py-3 text-center text-xs font-bold border-b-2 border-indigo-500 text-indigo-400">好友名單</button>
        <button onclick="switchTab('chats')" id="tab-chats" class="flex-1 py-3 text-center text-xs font-bold text-slate-400">聊天室</button>
        <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-3 text-center text-xs font-bold text-slate-400">基本設定</button>
      </div>

      <div id="page-friends" class="flex-1 overflow-y-auto p-2">
        <div class="text-xs text-indigo-400 font-bold mb-2">好友邀請</div>
        <div id="friend-requests-container" class="mb-4"></div>
        <div class="text-xs text-slate-400 font-bold mb-2">我的好友</div>
        <div id="friends-container"></div>
      </div>

      <div id="page-chats" class="flex-1 overflow-y-auto p-2 hidden">
        <input type="text" id="search-chat-input" oninput="filterChats(this.value)" placeholder="🔍 搜尋對話紀錄與好友..." class="w-full p-2 mb-2 bg-slate-800 rounded text-xs text-white border border-slate-700">
        <div id="chats-container"></div>
      </div>

      <!-- 基本設定 -->
      <div id="page-settings" class="flex-1 overflow-y-auto p-4 hidden flex flex-col gap-4">
        <div class="flex flex-col items-center gap-2">
          <img id="settings-avatar-preview" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500">
          <label class="bg-indigo-600 text-xs px-3 py-1.5 rounded cursor-pointer font-bold">
            選擇圖片上傳頭像
            <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="uploadAvatar(this)">
          </label>
        </div>
        <hr class="border-slate-700">
        <div class="flex flex-col gap-2">
          <label class="block text-xs font-bold text-slate-400">全局通知提醒鈴聲 (點擊切換試聽)</label>
          <select id="global-msg-sound" onchange="updateGlobalSound('msg_sound', this.value)" class="w-full p-2 bg-slate-800 rounded border border-slate-700 text-xs">
            <option value="default">預設清脆音</option>
            <option value="chime">和緩水滴聲</option>
            <option value="pop">輕快 POP 聲</option>
          </select>

          <label class="block text-xs font-bold text-slate-400 mt-2">全局來電提醒鈴聲 (點擊切換試聽)</label>
          <select id="global-call-sound" onchange="updateGlobalSound('call_sound', this.value)" class="w-full p-2 bg-slate-800 rounded border border-slate-700 text-xs">
            <option value="default">預設經典電話聲</option>
            <option value="digital">數位和弦聲</option>
            <option value="soft">柔和雙音管</option>
          </select>
        </div>
        <hr class="border-slate-700">
        <div>
          <label class="block text-xs font-bold text-red-400 mb-2">黑名單 / 已封鎖使用者</label>
          <div id="blocked-users-container" class="bg-slate-800 rounded p-2 text-xs flex flex-col gap-2"></div>
        </div>
        <hr class="border-slate-700">
        <div>
          <button onclick="logout()" class="w-full bg-red-600 py-2 rounded text-xs font-bold">登出帳號</button>
        </div>
      </div>
    </section>

    <!-- 對話視窗 -->
    <section id="chat-window" class="w-full md:w-2/3 flex flex-col bg-slate-900 absolute md:relative inset-0 z-30 translate-x-full md:translate-x-0 transition-transform duration-300">
      
      <!-- 精簡化頂部 Header (LINE 風格) -->
      <div id="chat-header" class="p-3 bg-slate-800 flex justify-between items-center border-b border-slate-700 hidden relative">
        <div class="flex items-center gap-2">
          <button onclick="closeChatWindow()" class="bg-indigo-600 px-3 py-1 rounded text-xs font-bold md:hidden">← 返回</button>
          <div>
            <span id="chat-title" class="font-bold text-sm block"></span>
            <span id="typing-status" class="text-[10px] text-indigo-400 hidden">對方正在輸入...</span>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- 對話內關鍵字搜尋 -->
          <input type="text" id="chat-search-input" oninput="searchInChat(this.value)" placeholder="🔍 搜尋對話..." class="px-2 py-1 bg-slate-700 rounded text-xs text-white border-none w-28 md:w-36">
          
          <!-- 通話按鈕：預設純語音，另設視訊 -->
          <button onclick="triggerHeaderCall(false)" title="語音通話" class="text-slate-300 hover:text-white text-lg">📞</button>
          <button onclick="triggerHeaderCall(true)" title="視訊通話" class="text-slate-300 hover:text-white text-lg">📹</button>
          
          <!-- LINE 式 更多功能菜單 ⋮ -->
          <button onclick="toggleMoreMenu()" class="text-slate-300 hover:text-white text-xl px-1 font-bold">⋮</button>
        </div>

        <!-- 下拉式選單區 -->
        <div id="chat-more-menu" class="absolute right-3 top-12 bg-slate-800 border border-slate-700 rounded-lg shadow-xl hidden z-50 flex flex-col w-44 text-xs">
          <button onclick="toggleMoreMenu(); openNotesBoard();" class="p-3 hover:bg-slate-700 text-left border-b border-slate-700 flex items-center gap-2">📝 記事本</button>
          <button onclick="toggleMoreMenu(); openMediaGallery();" class="p-3 hover:bg-slate-700 text-left border-b border-slate-700 flex items-center gap-2">🖼️ 照片 / 影片庫</button>
          <button id="menu-invite-btn" onclick="toggleMoreMenu(); openInviteModal();" class="p-3 hover:bg-slate-700 text-left border-b border-slate-700 flex items-center gap-2 hidden">➕ 邀請好友加入</button>
          <button id="menu-members-btn" onclick="toggleMoreMenu(); openGroupMembersModal();" class="p-3 hover:bg-slate-700 text-left border-b border-slate-700 flex items-center gap-2 hidden">👥 群組成員</button>
          <button onclick="toggleMoreMenu(); openChatCustomSettings();" class="p-3 hover:bg-slate-700 text-left border-b border-slate-700 flex items-center gap-2">🔔 獨立鈴聲與設定</button>
          <button onclick="toggleMoreMenu(); leaveOrDeleteChat();" class="p-3 hover:bg-slate-700 text-left text-red-400 flex items-center gap-2">🚪 退出 / 刪除聊天</button>
        </div>
      </div>

      <div id="messages-box" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3"></div>

      <div id="reply-preview" class="bg-slate-800 px-3 py-1 border-t border-slate-700 text-xs text-slate-300 flex justify-between items-center hidden">
        <span id="reply-text"></span>
        <button onclick="cancelReply()" class="text-slate-400">✕</button>
      </div>

      <div id="mention-menu" class="bg-slate-800 border border-slate-700 rounded-t-lg hidden max-h-32 overflow-y-auto p-1"></div>

      <div id="chat-input-area" class="p-3 bg-slate-800 border-t border-slate-700 flex items-center gap-2 hidden">
        <input type="file" id="file-input" class="hidden" onchange="uploadFile(this)">
        <button onclick="document.getElementById('file-input').click()" class="bg-slate-700 p-2 rounded text-xs">📎 檔案</button>
        <button id="voice-btn" onclick="toggleVoiceRecord()" class="bg-slate-700 p-2 rounded text-xs">🎙️ 語音</button>
        <input id="msg-input" type="text" oninput="handleInputTyping(this)" placeholder="輸入訊息..." class="flex-1 p-2 rounded bg-slate-700 text-white border-none focus:outline-none text-sm">
        <button onclick="sendMessage()" class="bg-indigo-600 px-4 py-2 rounded text-xs font-bold">發送</button>
      </div>
    </section>
  </main>

  <!-- 全域模組彈窗 -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/80 flex justify-center items-center hidden">
    <div class="bg-slate-800 p-6 rounded-lg max-w-sm w-full flex flex-col items-center gap-4 relative max-h-[80vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-2 right-2 text-slate-400 text-lg">✕</button>
      <div id="modal-content" class="w-full text-center"></div>
    </div>
  </div>

  <!-- 圖片放大檢視視窗 (Lightbox) -->
  <div id="image-lightbox" class="fixed inset-0 z-50 bg-black/90 flex justify-center items-center hidden" onclick="closeLightbox()">
    <img id="lightbox-img" class="max-w-full max-h-full object-contain p-4">
  </div>

  <!-- 通話視窗 -->
  <div id="video-container" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center hidden"></div>

  <script src="app.js"></script>
</body>
</html>
